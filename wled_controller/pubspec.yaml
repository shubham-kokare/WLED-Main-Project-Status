name: wled_controller
description: "A cross-platform native Flutter controller for WLED devices"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Reactive State Management
  flutter_riverpod: ^2.5.1
  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5
  # Local Discovery & Persistence
  shared_preferences: ^2.2.3
  # UI & Controls
  flutter_colorpicker: ^1.1.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
